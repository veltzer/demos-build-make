# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.requirements]
src_dirs = ["scripts"]
enabled = false

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# Lint every standalone example makefile with a parse-and-plan dry run:
# the script runs "make -n -f <file>" on each file, expecting failure
# instead of success for files marked with "# ERROR MAKEFILE".
[processor.script.make_lint]
command = "scripts/check_mk.py"
required_tools = ["make"]
src_dirs = ["src.mk"]
src_extensions = [".mk"]
# GOAL (achieved): every example passes the lint; there is no exclude
# list. Never introduce one - fix failing examples instead, or extend
# scripts/check_mk.py if the lint needs to learn something new.
