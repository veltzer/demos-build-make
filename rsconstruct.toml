# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.checker.ruff]
src_dirs = ["scripts"]


[processor.checker.pyrefly]
src_dirs = ["scripts"]

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── repo-specific configuration ────────────────────────────────────────────

# Lint every standalone example makefile with a parse-and-plan dry run:
# the script runs "make -n -f <file>" on each file, expecting failure
# instead of success for files marked with "# ERROR MAKEFILE".
[processor.checker.script.make_lint]
command = "scripts/check_mk.py"
required_tools = ["make"]
src_dirs = ["src.mk"]
src_extensions = [".mk"]
# GOAL (achieved): every example passes the lint; there is no exclude
# list. Never introduce one - fix failing examples instead, or extend
# scripts/check_mk.py if the lint needs to learn something new.

# lint the YAML files with yamllint (policy: .yamllint.yaml)
[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = [".yamllint.yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["doc"]
src_files = ["CLAUDE.md", "README.md"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.ishellcheck]
src_dirs = ["standalone"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

# Demos whose whole program lives in one directory: one run per directory.
[processor.checker.cppcheck.single_dir]
batch_by_dir = true
src_dirs = ["standalone"]
src_exclude_dirs = ["deps_makedepend", "deps_using_gcc"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]

# deps_makedepend is one program split over myapp/ and mylib/ (one Makefile builds them together): one run over the whole project.
[processor.checker.cppcheck.deps_makedepend]
batch = true
src_dirs = ["standalone/deps_makedepend"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]

# deps_using_gcc is one program split over binmain/ and libadd/ (one Makefile builds them together): one run over the whole project.
[processor.checker.cppcheck.deps_using_gcc]
batch = true
src_dirs = ["standalone/deps_using_gcc"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability,information,unusedFunction",
	"--check-level=exhaustive",
	"--inline-suppr",
]
